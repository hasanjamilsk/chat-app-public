<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<title>চ্যাট অ্যাপ</title>
<style>
  :root {
    --bg: #f3f4f6; --card: #fff; --text: #111827; --muted: #6b7280;
    --brand: #0f766e; --brand-d: #0b5a54; --mine: #d1fae5; --theirs: #fff;
    --border: #e5e7eb; --danger: #b91c1c;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0b1210; --card: #14201d; --text: #e5e7eb; --muted: #9ca3af;
      --brand: #14b8a6; --brand-d: #0f766e; --mine: #0f4a42; --theirs: #1b2b27; --border: #243630; --danger: #f87171; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font-family: system-ui, -apple-system, "Noto Sans Bengali", "Hind Siliguri", sans-serif;
    background: var(--bg); color: var(--text); }
  button, input { font: inherit; color: inherit; }
  .hidden { display: none !important; }

  /* ---- লগইন ---- */
  #auth { min-height: 100%; display: flex; align-items: center; justify-content: center; padding: 16px; }
  .auth-card { width: 100%; max-width: 380px; background: var(--card); border-radius: 16px; padding: 24px;
    border: 1px solid var(--border); }
  .auth-card h1 { margin: 0 0 4px; font-size: 24px; color: var(--brand); }
  .auth-card p.sub { margin: 0 0 18px; color: var(--muted); font-size: 14px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
  .tabs button { flex: 1; padding: 10px; border-radius: 10px; border: 1px solid var(--border); background: transparent; cursor: pointer; }
  .tabs button.active { background: var(--brand); color: #fff; border-color: var(--brand); }
  label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 4px; }
  input[type=text], input[type=tel], input[type=password] {
    width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); }
  .primary { width: 100%; margin-top: 18px; padding: 12px; border: 0; border-radius: 10px;
    background: var(--brand); color: #fff; font-weight: 600; cursor: pointer; }
  .primary:active { background: var(--brand-d); }
  .err { color: var(--danger); font-size: 13px; min-height: 18px; margin-top: 10px; }

  /* ---- মূল অ্যাপ ---- */
  #app { height: 100%; display: grid; grid-template-columns: 340px 1fr; }
  .side { display: flex; flex-direction: column; background: var(--card); border-right: 1px solid var(--border); min-height: 0; }
  .topbar { display: flex; align-items: center; gap: 8px; padding: 12px 14px; background: var(--brand); color: #fff; }
  .topbar .title { flex: 1; font-weight: 700; font-size: 18px; }
  .topbar button { background: rgba(255,255,255,.18); border: 0; color: #fff; padding: 6px 10px; border-radius: 8px; cursor: pointer; font-size: 13px; }
  .mycode { margin: 12px; padding: 12px; border-radius: 12px; background: var(--bg); border: 1px dashed var(--brand); }
  .mycode small { color: var(--muted); display: block; }
  .mycode .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .mycode code { font-size: 20px; letter-spacing: 2px; font-weight: 700; color: var(--brand); flex: 1; }
  .mycode button { border: 1px solid var(--brand); background: transparent; color: var(--brand); border-radius: 8px; padding: 6px 10px; cursor: pointer; }
  .addbox { display: flex; gap: 8px; padding: 0 12px 8px; }
  .addbox input { flex: 1; text-transform: uppercase; }
  .addbox button { border: 0; background: var(--brand); color: #fff; border-radius: 10px; padding: 0 14px; cursor: pointer; font-weight: 600; }
  .addmsg { padding: 0 14px 6px; font-size: 13px; min-height: 20px; }
  .list { flex: 1; overflow-y: auto; }
  .contact { display: flex; gap: 12px; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--border); cursor: pointer; }
  .contact:hover, .contact.active { background: var(--bg); }
  .avatar { width: 44px; height: 44px; border-radius: 50%; background: var(--brand); color: #fff; display: grid; place-items: center; font-weight: 700; flex: none; }
  .cinfo { flex: 1; min-width: 0; }
  .cname { font-weight: 600; }
  .clast { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .badge { background: var(--brand); color: #fff; border-radius: 999px; font-size: 12px; min-width: 22px; text-align: center; padding: 2px 7px; }
  .empty { text-align: center; color: var(--muted); padding: 32px 20px; font-size: 14px; }

  .chat { display: flex; flex-direction: column; min-height: 0; min-width: 0; background: var(--bg); }
  .chat-head { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: var(--brand); color: #fff; }
  .chat-head .back { display: none; background: transparent; border: 0; color: #fff; font-size: 22px; cursor: pointer; }
  .chat-head .avatar { background: rgba(255,255,255,.25); width: 38px; height: 38px; }
  .chat-head .soon { margin-left: auto; display: flex; gap: 6px; }
  .chat-head .soon button { background: rgba(255,255,255,.18); border: 0; color: #fff; border-radius: 8px; padding: 6px 10px; cursor: pointer; }
  .msgs { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 6px; }
  .bubble { max-width: 78%; padding: 8px 12px; border-radius: 14px; background: var(--theirs); border: 1px solid var(--border);
    white-space: pre-wrap; word-break: break-word; align-self: flex-start; }
  .bubble.mine { align-self: flex-end; background: var(--mine); }
  .bubble time { display: block; font-size: 11px; color: var(--muted); text-align: right; margin-top: 2px; }
  .placeholder { margin: auto; color: var(--muted); text-align: center; padding: 20px; }
  .emoji-row { display: flex; flex-wrap: wrap; gap: 4px; padding: 8px 10px; background: var(--card); border-top: 1px solid var(--border); }
  .emoji-row button { background: transparent; border: 0; font-size: 24px; cursor: pointer; padding: 2px 4px; }
  .composer { display: flex; gap: 8px; padding: 10px; background: var(--card); border-top: 1px solid var(--border); padding-bottom: max(10px, env(safe-area-inset-bottom)); }
  .composer input { flex: 1; border-radius: 999px; padding: 11px 16px; }
  .composer .emo { background: transparent; border: 0; font-size: 24px; cursor: pointer; }
  .composer .send { border: 0; background: var(--brand); color: #fff; border-radius: 999px; padding: 0 18px; font-weight: 600; cursor: pointer; }

  /* ---- মোবাইল ---- */
  @media (max-width: 760px) {
    #app { grid-template-columns: 1fr; }
    #app.in-chat .side { display: none; }
    #app:not(.in-chat) .chat { display: none; }
    .chat-head .back { display: block; }
  }
</style>
</head>
<body>

<!-- লগইন / রেজিস্টার -->
<div id="auth">
  <div class="auth-card">
    <h1>চ্যাট অ্যাপ</h1>
    <p class="sub">নাম্বার আর পাসওয়ার্ড দিয়ে ঢোকো। অন্যদের সাথে কথা বলতে তোমার ইউনিক কোড শেয়ার করবে।</p>
    <div class="tabs">
      <button id="tab-login" class="active" type="button">লগইন</button>
      <button id="tab-register" type="button">নতুন অ্যাকাউন্ট</button>
    </div>
    <form id="auth-form" autocomplete="on">
      <div id="name-wrap" class="hidden">
        <label for="name">তোমার নাম</label>
        <input id="name" type="text" maxlength="40" autocomplete="name">
      </div>
      <label for="phone">মোবাইল নাম্বার</label>
      <input id="phone" type="tel" inputmode="tel" autocomplete="username" placeholder="01XXXXXXXXX">
      <label for="password">পাসওয়ার্ড</label>
      <input id="password" type="password" autocomplete="current-password">
      <div class="err" id="auth-err"></div>
      <button class="primary" id="auth-btn" type="submit">লগইন</button>
    </form>
  </div>
</div>

<!-- মূল অ্যাপ -->
<div id="app" class="hidden">
  <aside class="side">
    <div class="topbar">
      <span class="title" id="me-name"></span>
      <button id="logout" type="button">বের হও</button>
    </div>
    <div class="mycode">
      <small>তোমার ইউনিক কোড (বন্ধুকে এটা দাও)</small>
      <div class="row"><code id="my-code"></code><button id="copy-code" type="button">কপি</button></div>
    </div>
    <form class="addbox" id="add-form">
      <input id="add-code" type="text" placeholder="বন্ধুর কোড (ABCD-2345)" maxlength="9" autocomplete="off">
      <button type="submit">যোগ করো</button>
    </form>
    <div class="addmsg" id="add-msg"></div>
    <div class="list" id="contact-list"></div>
  </aside>

  <main class="chat">
    <div id="chat-empty" class="placeholder">বাঁদিকে থেকে কাউকে বেছে নাও,<br>অথবা বন্ধুর কোড দিয়ে নতুন কাউকে যোগ করো।</div>
    <div id="chat-view" style="display:none;flex-direction:column;min-height:0;flex:1">
      <div class="chat-head">
        <button class="back" id="back" type="button" aria-label="পেছনে">←</button>
        <div class="avatar" id="chat-avatar"></div>
        <div><div id="chat-name" style="font-weight:700"></div></div>
        <div class="soon">
          <button type="button" data-soon="অডিও কল" aria-label="অডিও কল">📞</button>
          <button type="button" data-soon="ভিডিও কল" aria-label="ভিডিও কল">🎥</button>
        </div>
      </div>
      <div class="msgs" id="msgs"></div>
      <div class="emoji-row hidden" id="emoji-row"></div>
      <form class="composer" id="composer">
        <button class="emo" id="emo-btn" type="button" aria-label="ইমোজি">😊</button>
        <input id="msg-input" type="text" placeholder="মেসেজ লেখো..." autocomplete="off" maxlength="4000">
        <button class="send" type="submit">পাঠাও</button>
      </form>
    </div>
  </main>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const EMOJIS = ['😀','😂','🥰','😍','😎','🤔','😢','😡','👍','👏','🙏','❤️','🔥','🎉','😴','🤝','🙌','😅','🥳','💯','🌹','☕','🍕','✅'];

  const state = { token: localStorage.getItem('token'), me: null, contacts: [], current: null,
    msgs: {}, lastPoll: 0, lastRead: {}, pollTimer: null, mode: 'login' };

  // ---------- API ----------
  async function api(path, opts = {}) {
    const res = await fetch('/api' + path, {
      method: opts.method || 'GET',
      headers: { 'Content-Type': 'application/json', ...(state.token ? { Authorization: 'Bearer ' + state.token } : {}) },
      body: opts.body ? JSON.stringify(opts.body) : undefined,
    });
    const data = await res.json().catch(() => ({}));
    if (res.status === 401 && state.token && !path.startsWith('/login')) { doLogout(false); }
    if (!res.ok) throw new Error(data.error || 'কিছু একটা সমস্যা হয়েছে');
    return data;
  }

  // ---------- লগইন / রেজিস্টার ----------
  function setMode(mode) {
    state.mode = mode;
    $('tab-login').classList.toggle('active', mode === 'login');
    $('tab-register').classList.toggle('active', mode === 'register');
    $('name-wrap').classList.toggle('hidden', mode !== 'register');
    $('auth-btn').textContent = mode === 'login' ? 'লগইন' : 'অ্যাকাউন্ট খোলো';
    $('password').autocomplete = mode === 'login' ? 'current-password' : 'new-password';
    $('auth-err').textContent = '';
  }
  $('tab-login').onclick = () => setMode('login');
  $('tab-register').onclick = () => setMode('register');

  $('auth-form').onsubmit = async (e) => {
    e.preventDefault();
    $('auth-err').textContent = '';
    try {
      const body = { phone: $('phone').value, password: $('password').value };
      if (state.mode === 'register') body.name = $('name').value;
      const data = await api(state.mode === 'login' ? '/login' : '/register', { method: 'POST', body });
      state.token = data.token;
      localStorage.setItem('token', data.token);
      $('password').value = '';
      await startApp(data.user);
    } catch (err) { $('auth-err').textContent = err.message; }
  };

  function doLogout(callApi = true) {
    if (callApi && state.token) api('/logout', { method: 'POST' }).catch(() => {});
    clearInterval(state.pollTimer);
    localStorage.removeItem('token');
    Object.assign(state, { token: null, me: null, contacts: [], current: null, msgs: {}, lastPoll: 0 });
    $('app').classList.add('hidden');
    $('auth').classList.remove('hidden');
  }
  $('logout').onclick = () => doLogout(true);

  // ---------- অ্যাপ শুরু ----------
  async function startApp(user) {
    state.me = user;
    state.lastRead = JSON.parse(localStorage.getItem('lastRead:' + user.id) || '{}');
    $('me-name').textContent = user.name;
    $('my-code').textContent = user.code;
    $('auth').classList.add('hidden');
    $('app').classList.remove('hidden');
    $('app').classList.remove('in-chat');
    showChat(null);
    await loadContacts();
    // আগের সব ইনকামিং মেসেজ এনে না-পড়া সংখ্যা হিসাব
    const { messages } = await api('/poll?after=0');
    ingest(messages);
    renderContacts();
    clearInterval(state.pollTimer);
    state.pollTimer = setInterval(poll, 1500);
  }

  async function loadContacts() {
    const { contacts } = await api('/contacts');
    state.contacts = contacts;
    renderContacts();
  }

  function saveLastRead() { localStorage.setItem('lastRead:' + state.me.id, JSON.stringify(state.lastRead)); }

  function unreadCount(contactId) {
    const lr = state.lastRead[contactId] || 0;
    return (state.msgs[contactId] || []).filter((m) => m.from_id === contactId && m.id > lr).length;
  }

  // নতুন মেসেজ ঢুকিয়ে নেওয়া
  let needContactRefresh = false;
  function ingest(messages) {
    for (const m of messages) {
      state.lastPoll = Math.max(state.lastPoll, m.id);
      const other = m.from_id === state.me.id ? m.to_id : m.from_id;
      const list = (state.msgs[other] ||= []);
      if (!list.some((x) => x.id === m.id)) list.push(m);
      list.sort((a, b) => a.id - b.id);
      const c = state.contacts.find((c) => c.id === other);
      if (c) { c.last_text = m.text; c.last_at = m.created_at; } else needContactRefresh = true;
    }
  }

  async function poll() {
    try {
      const { messages } = await api('/poll?after=' + state.lastPoll);
      if (!messages.length) return;
      ingest(messages);
      if (needContactRefresh) { needContactRefresh = false; await loadContacts(); }
      if (state.current) markRead(state.current);
      renderContacts();
      if (state.current) renderMsgs();
    } catch (e) { /* নেটওয়ার্ক সমস্যা হলে পরের বার আবার চেষ্টা */ }
  }

  // ---------- কন্টাক্ট লিস্ট ----------
  function renderContacts() {
    const box = $('contact-list');
    box.textContent = '';
    const sorted = [...state.contacts].sort((a, b) => (b.last_at || 0) - (a.last_at || 0));
    if (!sorted.length) {
      const d = document.createElement('div');
      d.className = 'empty';
      d.textContent = 'এখনো কেউ নেই। বন্ধুর কোড উপরে লিখে "যোগ করো" চাপো।';
      box.append(d);
      return;
    }
    for (const c of sorted) {
      const row = document.createElement('div');
      row.className = 'contact' + (state.current === c.id ? ' active' : '');
      const av = document.createElement('div'); av.className = 'avatar'; av.textContent = (c.name || '?').trim().charAt(0).toUpperCase();
      const info = document.createElement('div'); info.className = 'cinfo';
      const nm = document.createElement('div'); nm.className = 'cname'; nm.textContent = c.name;
      const ls = document.createElement('div'); ls.className = 'clast'; ls.textContent = c.last_text || c.code;
      info.append(nm, ls);
      row.append(av, info);
      const n = unreadCount(c.id);
      if (n > 0 && state.current !== c.id) { const b = document.createElement('span'); b.className = 'badge'; b.textContent = n; row.append(b); }
      row.onclick = () => openChat(c.id);
      box.append(row);
    }
  }

  // কোড দিয়ে বন্ধু যোগ
  $('add-form').onsubmit = async (e) => {
    e.preventDefault();
    const msg = $('add-msg');
    try {
      const { contact } = await api('/contacts', { method: 'POST', body: { code: $('add-code').value } });
      msg.style.color = 'var(--brand)';
      msg.textContent = contact.name + ' কে যোগ করা হয়েছে ✓';
      $('add-code').value = '';
      await loadContacts();
      openChat(contact.id);
    } catch (err) { msg.style.color = 'var(--danger)'; msg.textContent = err.message; }
  };

  $('copy-code').onclick = async () => {
    try { await navigator.clipboard.writeText(state.me.code); $('copy-code').textContent = 'কপি হয়েছে ✓'; }
    catch { $('copy-code').textContent = 'নিজে কপি করো'; }
    setTimeout(() => ($('copy-code').textContent = 'কপি'), 1500);
  };

  // ---------- চ্যাট ----------
  function showChat(contact) {
    const view = $('chat-view');
    if (!contact) { $('chat-empty').classList.remove('hidden'); view.style.display = 'none'; return; }
    $('chat-empty').classList.add('hidden');
    view.style.display = 'flex';
    $('chat-name').textContent = contact.name;
    $('chat-avatar').textContent = contact.name.trim().charAt(0).toUpperCase();
  }

  async function openChat(id) {
    state.current = id;
    const c = state.contacts.find((c) => c.id === id);
    showChat(c);
    $('app').classList.add('in-chat');
    $('emoji-row').classList.add('hidden');
    const { messages } = await api('/messages?with=' + id);
    state.msgs[id] = messages;
    for (const m of messages) state.lastPoll = Math.max(state.lastPoll, m.to_id === state.me.id ? m.id : 0);
    markRead(id);
    renderContacts();
    renderMsgs();
    $('msg-input').focus();
  }

  function markRead(id) {
    const list = state.msgs[id] || [];
    const last = list.length ? list[list.length - 1].id : 0;
    if ((state.lastRead[id] || 0) < last) { state.lastRead[id] = last; saveLastRead(); }
  }

  function fmtTime(ts) {
    return new Date(ts).toLocaleTimeString('bn-BD', { hour: 'numeric', minute: '2-digit' });
  }

  function renderMsgs() {
    const box = $('msgs');
    const nearBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 80;
    box.textContent = '';
    const list = state.msgs[state.current] || [];
    if (!list.length) {
      const d = document.createElement('div'); d.className = 'placeholder'; d.textContent = 'এখনো কোনো মেসেজ নেই। প্রথম মেসেজটা পাঠাও 👋';
      box.append(d); return;
    }
    for (const m of list) {
      const b = document.createElement('div');
      b.className = 'bubble' + (m.from_id === state.me.id ? ' mine' : '');
      b.append(document.createTextNode(m.text));
      const t = document.createElement('time'); t.textContent = fmtTime(m.created_at);
      b.append(t);
      box.append(b);
    }
    if (nearBottom || list.length) box.scrollTop = box.scrollHeight;
  }

  $('composer').onsubmit = async (e) => {
    e.preventDefault();
    const input = $('msg-input');
    const text = input.value.trim();
    if (!text || !state.current) return;
    input.value = '';
    try {
      const { message } = await api('/messages', { method: 'POST', body: { to: state.current, text } });
      const list = (state.msgs[state.current] ||= []);
      if (!list.some((x) => x.id === message.id)) list.push(message);
      const c = state.contacts.find((c) => c.id === state.current);
      if (c) { c.last_text = text; c.last_at = message.created_at; }
      markRead(state.current);
      renderMsgs(); renderContacts();
    } catch (err) { input.value = text; alert(err.message); }
  };

  $('back').onclick = () => { $('app').classList.remove('in-chat'); state.current = null; showChat(null); renderContacts(); };

  // ইমোজি
  const row = $('emoji-row');
  for (const e of EMOJIS) {
    const b = document.createElement('button'); b.type = 'button'; b.textContent = e;
    b.onclick = () => { const i = $('msg-input'); i.value += e; i.focus(); };
    row.append(b);
  }
  $('emo-btn').onclick = () => row.classList.toggle('hidden');

  // কল বাটন (পরের ধাপে আসবে)
  document.querySelectorAll('[data-soon]').forEach((b) => {
    b.onclick = () => alert(b.dataset.soon + ' পরের ভার্সনে আসছে!');
  });

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});

  // ---------- শুরুতে আগের লগইন থাকলে ঢুকে পড়া ----------
  (async () => {
    if (!state.token) return;
    try { const { user } = await api('/me'); await startApp(user); }
    catch { doLogout(false); }
  })();
})();
</script>
</body>
</html>
